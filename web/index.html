<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suno — tu biblioteca</title>
  <link rel="stylesheet" href="/static/estilos.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span>Suno</span>
      </div>
      <nav class="nav">
        <button type="button" data-view="inicio" class="nav-btn is-active">
          <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
          Inicio
        </button>
        <button type="button" data-view="buscar" class="nav-btn">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Buscar
        </button>
        <button type="button" data-view="biblioteca" class="nav-btn">
          <svg viewBox="0 0 24 24"><path d="M4 5h12a2 2 0 0 1 2 2v13H6a2 2 0 0 1-2-2zm16 2v13h-2V7z"/></svg>
          Biblioteca
        </button>
        <button type="button" data-view="gustos" class="nav-btn">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg>
          Me gusta
        </button>
      </nav>
      <div class="side-label">Estilos</div>
      <div id="tag-list" class="tag-list"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <nav class="mobile-nav">
          <button type="button" data-view="inicio">Inicio</button>
          <button type="button" data-view="buscar">Buscar</button>
          <button type="button" data-view="biblioteca">Biblioteca</button>
          <button type="button" data-view="gustos">Me gusta</button>
        </nav>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="¿Qué querés escuchar?" autocomplete="off" />
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <aside id="panel" class="panel" hidden>
      <div class="panel-tabs">
        <button type="button" data-tab="letra" class="is-active">Letra</button>
        <button type="button" data-tab="cola">Cola</button>
        <button type="button" id="close-panel" class="icon-btn" aria-label="Cerrar panel">✕</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </div>

  <footer class="player">
    <div class="now">
      <div id="now-cover" class="now-cover"></div>
      <div class="now-meta">
        <div id="now-title" class="now-title">Elegí un tema</div>
        <div id="now-artist" class="now-artist">Biblioteca Suno</div>
      </div>
      <button type="button" id="like-btn" class="icon-btn like" aria-label="Me gusta">♡</button>
    </div>

    <div class="transport">
      <div class="transport-btns">
        <button type="button" id="shuffle" class="icon-btn" aria-label="Aleatorio">
          <svg viewBox="0 0 24 24"><path d="M4 7h3l4 5-4 5H4m9-10h3l4 5-4 5h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 7h4v4M16 17h4v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="prev" class="icon-btn" aria-label="Anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6v12M18 6 8 12l10 6z"/></svg>
        </button>
        <button type="button" id="play" class="play-main" aria-label="Reproducir">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l12-7z"/></svg>
        </button>
        <button type="button" id="next" class="icon-btn" aria-label="Siguiente">
          <svg viewBox="0 0 24 24"><path d="M18 6v12M6 6l10 6-10 6z"/></svg>
        </button>
        <button type="button" id="repeat" class="icon-btn" aria-label="Repetir">
          <svg viewBox="0 0 24 24"><path d="M17 3v4h4M7 21v-4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 7a8 8 0 0 0-14.5-2M4 17a8 8 0 0 0 14.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="seek-row">
        <span id="time-current">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" />
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="extras">
      <button type="button" id="lyrics-btn" class="icon-btn" aria-label="Letra">
        <svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v14l-4-2-4 2-4-2-4 2V7a3 3 0 0 1 3-3z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <a id="suno-link" class="icon-btn" href="#" target="_blank" rel="noreferrer" hidden aria-label="Abrir en Suno">
        <svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 6H6v12h12v-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </a>
      <svg class="vol-icon" viewBox="0 0 24 24"><path d="M4 10h3l4-3v10l-4-3H4zm11 1a3 3 0 0 1 0 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" />
    </div>
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="/static/app.js"></script>
</body>
</html>
