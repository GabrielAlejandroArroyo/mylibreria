name: Sincronizar Suno

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "catalogo.json"
      - "karaoke_timings.json"
      - "generar_sitio.py"

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'GabrielAlejandroArroyo/mylibreria'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -r requirements.txt
      - name: Regenerar sitio
        run: python generar_sitio.py
      - name: Comprobar sesión Suno
        id: suno
        shell: pwsh
        env:
          SUNO_COOKIE: ${{ secrets.SUNO_COOKIE }}
        run: |
          if ($env:SUNO_COOKIE) {
            "has_cookie=true" >> $env:GITHUB_OUTPUT
          } else {
            "has_cookie=false" >> $env:GITHUB_OUTPUT
          }
      - name: Aviso sin sesión Suno
        if: steps.suno.outputs.has_cookie != 'true'
        shell: pwsh
        run: |
          Write-Warning "Sin SUNO_COOKIE: se publica el catálogo del repo, sin traer temas nuevos de Suno."
          echo "::warning::Configurá el secret SUNO_COOKIE en Settings → Secrets → Actions para sincronizar tu biblioteca."
      - name: Sincronizar biblioteca Suno
        if: steps.suno.outputs.has_cookie == 'true'
        env:
          SUNO_COOKIE: ${{ secrets.SUNO_COOKIE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python sincronizar.py --publicar-web
      - name: Publicar
        shell: pwsh
        run: |
          git config user.name "suno-sync"
          git config user.email "suno-sync@users.noreply.github.com"
          git add docs web/temas.json
          foreach ($file in @("catalogo.json", "catalogo.csv", "suno_library.json", "sync_estado.json", "karaoke_timings.json")) {
            if (Test-Path $file) { git add $file }
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publicar sitio y actualizar biblioteca"
            git push
          }