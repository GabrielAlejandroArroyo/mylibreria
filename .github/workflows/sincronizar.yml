name: Sincronizar Suno

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'GabrielAlejandroArroyo/mylibreria'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -r requirements.txt
      - name: Sincronizar
        env:
          SUNO_COOKIE: ${{ secrets.SUNO_COOKIE }}
        run: python sincronizar.py --publicar-web
      - name: Publicar
        run: |
          git config user.name "suno-sync"
          git config user.email "suno-sync@users.noreply.github.com"
          git add catalogo.json catalogo.csv suno_library.json sync_estado.json docs
          git diff --cached --quiet || git commit -m "Actualizar biblioteca Suno"
          git push
